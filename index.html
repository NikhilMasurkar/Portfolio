  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Per-page title/description/canonical are rendered by <Seo>. A static
       one here would sit alongside the page-specific tag rather than being
       replaced by it, so only site-wide values belong in this file. -->
</head>
