[build]
  # The server bundle must exist before functions are bundled — the SSR
  # function requires build-server/index.cjs directly. `npm run build` runs
  # the client build then the server build, in that order.
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Everything that is not a real file in build/ renders through Express.
# force = false, so the CDN serves an existing static file first and the
# function is only reached for routes. status 200 (not 301) keeps the URL.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200
  force = false

# Production cache headers. express.static's setHeaders never runs here —
# Netlify's CDN serves build/ before the function is invoked — so these are
# the real ones. Keep in step with server/index.js.
#
# /assets/* is content-hashed by Vite: the bytes at a URL never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts are NOT hashed — the filename is stable across a font swap — so they
# get a shorter life plus stale-while-revalidate rather than immutable.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
